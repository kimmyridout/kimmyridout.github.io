<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Contact | Kim Ridout</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

<header class="site-header">
  <div class="logo">Portfolio</div>

  <nav class="nav-links">
    <a href="index.html">Home</a>
    <a href="projects.html">Projects</a>
    <a href="experience.html">Experience</a>
    <!-- <a href="notes.html">Notes</a> -->
    <a href="contact.html">Contact</a>
  </nav>

  <button id="theme-toggle">🌙 Dark Mode</button>
</header>

<div class="page-container">

  <!-- HEADER -->
  <section class="section">
    <h1>Let’s Connect</h1>

    <p class="contact-intro">
      Open to entry-level and transition-focused opportunities in
      Data Engineering, environmental data systems, sustainability analytics,
      and public-sector technology initiatives.
    </p>

  </section>

  <!-- QUICK CONNECT BUTTONS -->
  <section class="section">
    <h2>Quick Connect</h2>

    <div class="connect-actions">

      <a class="btn" href="mailto:kimmyridout@gmail.com">
        📧 Email Me
      </a>

      <a class="btn btn-outline" href="https://www.linkedin.com/in/kim-ridout-50b32a196" target="_blank">
        💼 LinkedIn
      </a>

      <a class="btn btn-outline" href="https://github.com/kimmyridout" target="_blank">
        🐙 GitHub
      </a>

    </div>
  </section>

  <!-- CONTACT FORM (OPTIONAL BUT NICE) -->
  <section class="section">
    <h2>Send a Message</h2>

    <form class="contact-form">

      <label>Name</label>
      <input type="text" placeholder="Your name" />

      <label>Email</label>
      <input type="email" placeholder="you@example.com" />

      <label>Message</label>
      <textarea rows="6" placeholder="What would you like to connect about?"></textarea>

      <button type="submit" class="btn">Send Message</button>

    </form>
  </section>

</div>

<script src="assets/js/script.js"></script>
</body>
</html>
